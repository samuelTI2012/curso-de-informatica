 <div id="bloqueio-tela" style="position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; font-family:sans-serif;">
  <h2>Este site é privado</h2>
  <p>Digite a senha para acessar:</p>
  <input type="password" id="campo-senha" placeholder="Digite a senha..." style="padding:10px; font-size:16px; margin-bottom:10px;">
  <button onclick="conferirSenha()" style="padding:10px 20px; font-size:16px; cursor:pointer;">Entrar</button>
  <p id="erro" style="color:red; display:none;">Senha incorreta! Tente novamente.</p>
</div>

<script>
  function conferirSenha() {
    var senhaDefinida = "123"; // Escreva aqui a senha que você quer
    var senhaDigitada = document.getElementById("campo-senha").value;

    if (senhaDigitada === senhaDefinida) {
      // Se a senha estiver certa, esconde a tela de bloqueio e mostra o site
      document.getElementById("bloqueio-tela").style.display = "none";
    } else {
      // Se estiver errada, mostra a mensagem de erro
      document.getElementById("erro").style.display = "block";
      document.getElementById("campo-senha").value = ""; // Limpa o campo
    }
  }
</script>
